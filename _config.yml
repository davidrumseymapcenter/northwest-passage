title: Search for the Northwest Passage
description: Curriculum material for teaching about the European quest to find a passageway between the Pacific and Atlantic Oceans. 

url: https://davidrumseymapcenter.github.io/
baseurl: "northwest-passage"

remote_theme: just-the-docs/just-the-docs

aux_links: # remove if you don't want this link to appear on your pages
  Home: https://davidrumseymapcenter.github.io/northwest-passage

plugins:
  - jekyll-default-layout
  - jekyll-remote-theme
  
# Enable or disable heading anchors
heading_anchors: true

# Makes Aux links open in a new tab. Default is false
aux_links_new_tab: false

# Enable or disable the side/mobile menu globally
# Nav menu can also be selectively enabled or disabled using page variables or the minimal layout
nav_enabled: true

# Footer content
# appears at the bottom of every page's main content

# Back to top link
back_to_top: false
back_to_top_text: "Back to top"

footer_content: "&copy; 2026 David Rumsey Map Center."

# Footer last edited timestamp
last_edit_timestamp: true # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: "%b %e %Y" # uses ruby's time format: https://ruby-doc.org/stdlib-2.7.0/libdoc/time/rdoc/Time.html

# Color scheme currently only supports "dark", "light"/nil (default), or a custom scheme that you define
color_scheme: nil

# When commented out, callouts_level defaults to quiet for the light scheme, and loud for dark
# callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
